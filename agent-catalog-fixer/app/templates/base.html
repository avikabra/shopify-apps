<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent Catalog Fixer{% endblock %}</title>
<meta name="shopify-api-key" content="{{ shopify_api_key }}">
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<script>
  // Carry the App Bridge session token on in-app navigation and fetches
  // so the server can authenticate with session tokens (Shopify embedded
  // app requirement). Plain links otherwise lose the token after the
  // first page.
  document.addEventListener('DOMContentLoaded', async () => {
    if (!window.shopify || !window.shopify.idToken) return;
    try {
      const token = await window.shopify.idToken();
      if (!token) return;
      document.querySelectorAll('a[href^="/app"]').forEach((a) => {
        const url = new URL(a.getAttribute('href'), window.location.origin);
        if (!url.searchParams.has('id_token')) {
          url.searchParams.set('id_token', token);
          a.setAttribute('href', url.pathname + url.search);
        }
      });
      document.querySelectorAll('form[action^="/app"]').forEach((f) => {
        const url = new URL(f.getAttribute('action'), window.location.origin);
        if (!url.searchParams.has('id_token')) {
          url.searchParams.set('id_token', token);
          f.setAttribute('action', url.pathname + url.search);
        }
      });
      const origFetch = window.fetch;
      window.fetch = (input, init = {}) => {
        const headers = new Headers(init.headers || {});
        if (!headers.has('Authorization')) {
          headers.set('Authorization', 'Bearer ' + token);
        }
        return origFetch(input, { ...init, headers });
      };
    } catch (e) {
      /* App Bridge unavailable (opened outside Shopify admin) — the
         server falls back to cookie/HMAC auth. */
    }
  });
</script>
<style>
  :root { --bg: #f6f6f7; --card: #fff; --ink: #1a1a1a; --muted: #6d7175;
          --green: #008060; --amber: #b98900; --red: #d72c0d; --line: #e1e3e5; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); margin: 0; padding: 24px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 20px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 140px; }
  .stat .num { font-size: 30px; font-weight: 700; }
  .grade { display: inline-block; width: 34px; height: 34px; line-height: 34px; text-align: center;
           border-radius: 8px; color: #fff; font-weight: 700; }
  .gA { background: var(--green); } .gB { background: #5c8a00; } .gC { background: var(--amber); }
  .gD { background: #c25e00; } .gF { background: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px;
          background: #eee; margin: 2px 4px 2px 0; cursor: pointer; border: 1px solid transparent; }
  .pill.active { background: #1a1a1a; color: #fff; }
  .sev-high { color: var(--red); font-weight: 600; } .sev-medium { color: var(--amber); font-weight: 600; }
  .sev-low { color: var(--muted); }
  button { background: #1a1a1a; color: #fff; border: 0; border-radius: 8px;
           padding: 8px 14px; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.secondary { background: #fff; color: #1a1a1a; border: 1px solid var(--line); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a1a; color: #fff;
           padding: 12px 18px; border-radius: 8px; display: none; max-width: 420px; }
  .bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; min-width: 90px; }
  .bar > div { height: 100%; background: var(--green); }
</style>
</head>
<body>
<div class="wrap">
{% block content %}{% endblock %}
</div>
<div class="toast" id="toast"></div>
<script>
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 4000);
}
async function api(path, opts = {}) {
  const r = await fetch(path, Object.assign({headers: {'Content-Type': 'application/json'}}, opts));
  return r.json();
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
