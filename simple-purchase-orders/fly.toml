# fly.toml — deploy with `fly launch` then `fly deploy`.
# Set secrets with: fly secrets set SHOPIFY_API_KEY=... SHOPIFY_API_SECRET=... DATABASE_URL=... HOST=https://<app>.fly.dev BILLING_ENFORCE=true

app = "simple-purchase-orders"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  EMAIL_MODE = "smtp"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/api/config"
  timeout = "5s"
