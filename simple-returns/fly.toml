# Fly.io deploy config. Run `fly launch` once, then `fly deploy`.
# Set secrets with: fly secrets set SHOPIFY_API_KEY=... SHOPIFY_API_SECRET=... \
#   ENCRYPTION_KEY=... DATABASE_URL=... APP_URL=https://<app>.fly.dev
app = "simple-returns"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 75

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  PORT = "8000"
  SHOPIFY_CLIENT_MODE = "real"
  SHIPPING_PROVIDER = "real"
  EMAIL_PROVIDER = "smtp"
  SKIP_AUTO_CREATE_TABLES = "1"
